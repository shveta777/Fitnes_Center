name: Build artifacts

on: [pull_request]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build
        run: dotnet build FitnessCenterApp.Tests/FitnessCenterApp.Tests.csproj --configuration &{{matrix.configuration}}

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitnessCenter-${{ matrix.configuration }}
          path: FitnessCenterApp_WPF/bin/${{ matrix.configuration }}/net9.0-windows/
          
