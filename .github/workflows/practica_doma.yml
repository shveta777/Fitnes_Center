name: Release CI
on: 
  push:
  schedule:
    - cron: '35 12 * * 1-5'
      timezone: "Europe/Moscow"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: check
        uses: actions/checkout@v4
      - name: setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: build
        run: dotnet commit 
  test: 
    runs-on: windows-latest
    steps:
      - name: check
        uses: actions/checkout@v4
      - name: setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: build
        run: dotnet test-c Release
